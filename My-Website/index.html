<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faint Signals - Astrophotography &amp; 3D Prints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root{
        --void: #0A0E1A;
        --void-2: #10152459;
        --graphite: #161C2C;
        --graphite-2: #1E2536;
        --starlight: #F0EDE4;
        --starlight-dim: #A9AFC0;
        --halpha: #E8543F;
        --oiii: #45B0A0;
        --filament: #FF8A3D;
        --line: #2A3348;
    }

    *{margin :0; padding:0; box-sizing:border-box;}

    html{ scroll-behavior:smooth;}

    body{
        background:var(--void);
        color:var(--starlight);
        font-family:'Inter', sans-serif;
        line-height:1.6;
        overflow-x:hidden;
    }

    h1,h2,h3{
        font-family:'Fraunces', serif;
        font-weight:500;
        letter-spacing:-0.01em;
    }

    a{ color:inherit; text-decoration:none; }
    .mono{ font-family:'JetBrains Mono' , monospace; }
        /*----------- Nav -------------*/
  nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; justify-content:space-between; align-items: center;
    padding:22px 5%;
    background:linear-gradient(to bottom, rgba(10,14,26,0.9), transparent);
    backdrop-filter:blur(2px);
  }
  .nav-mark{
    font-family:'Fraunces', serif; font-size:1.05rem; font-style:italic;
    display:flex; align-items:center; gap:8px;
  }
  .nav-mark span{
    width:6px; height:6px; height:6px; border-radius:50%; background:var(--halpha);
    box-shadow:0 0 8px var(--halpha);
    display:inline-block;
  }
  .nav-links{display:flex; gap:36px; font-size:0.9rem; color:var(starlight-dim); }
  .nav-links a:hover{ color:var(--starlight); }
  .nav-toggle{ display:none; } 

  /*--------- Hero ---------*/
   .hero{
    position:relative; height:100vh; min-height:640px;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:0 5% 90px;
    overflow:hidden;
  }
  #starfield{ position:absolute; inset:0; width:100%; height:100%; }
  .hero-glow{
    position:absolute; top:-20%; right:-10%; width:60%; height:80%;
    background:radial-gradient(circle, rgba(232,84,63,0.16), rgba(69,176,160,0.08) 45%, transparent 70%);
    filter:blur(40px); pointer-events:none;
  }
  .hero-content{ position:relative; max-width:780px; }
  .hero-eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:0.78rem;
    color:var(--oiii); margin-bottom:18px;
    display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;
  }
  .hero-eyebrow .sep{ color:var(--line); }
  h1.hero-title{
    font-size:clamp(2.6rem, 6vw, 5rem);
    line-height:1.02;
    font-weight:500;
     }
  h1.hero-title em{
    font-style:italic; color:var(--halpha); font-weight:400;
  }
  .hero-sub{
    margin-top:24px; max-width:480px; font-size:1.05rem; color:var(--starlight-dim);
  }
  .scroll-cue{
    position:absolute; bottom:28px; left:5%;
    font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--starlight-dim);
    display:flex; align-items:center; gap:10px;
  }
  .scroll-cue::after{
    content:''; width:1px; height:32px; background:linear-gradient(var(--starlight-dim), transparent);
  }
  /*--------- Section shell ---------*/
  section{ padding:120px 5%; position:relative;}
  .section-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:56px; gap:24px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:28px;
  }
  .section-head h2{ font-size:clamp(1.8rem, 3.4vw, 2.6rem); }
  .section-head p{ color:var(--starlight-dim); max-width:360px; font-size:0.95rem; }
  .section-index{ font-family: 'JetBrains Mono', monospace; color:var(--starlight-dim); font-size: 0.85rem; }

  /*--------- Astro Gallery ---------*/
  .astro-grid{
    display:grid; grid-template-columns:repeat(6, 1fr); gap:18px;
  }
  .plate{
    position:relative; border-radius:3px; overflow:hidden;
    border:1px solid var(--line);
  }
  .plate:nth-child(1){grid-column:span 4; grid-row:span 2; aspect-ratio:4/3;}
  .plate:nth-child(2){grid-column:span 2;}
  .plate:nth-child(3){grid-column:span 2;}
  .plate:nth-child(4){grid-column:span 3;}
  .plate:nth-child(5){grid-column:span 3;}

  .plate-surface{
    position:absolute; inset:0;
    transition:transform 0.6s cubic-bezier(.2,.7,.3,1);
  }
  .plate:hover .plate-surface{ transform:scale(1.04); }

  .plate-1 .plate-surface{ background:radical-gradient()}
</style>
